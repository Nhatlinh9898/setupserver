#cloud-config
# Ubuntu Server cloud-init (user-data)
# Đặt file này làm "user-data" trong thư mục nocloud trên USB/ISO.
# THAY mọi CHANGE_ME trước khi dùng. Sai SSH key + tắt password = bị khóa SSH.

hostname: server-01
manage_etc_hosts: true
timezone: Asia/Ho_Chi_Minh
locale: en_US.UTF-8

users:
  - name: admin
    # BOOTSTRAP ONLY: NOPASSWD:ALL is convenient for first boot / Ansible bootstrap.
    # After SSH key login is verified, tighten to passworded sudo or a command allowlist:
    #   sudo: ALL=(ALL) ALL
    #   # or: sudo: ALL=(ALL) NOPASSWD:/usr/bin/systemctl,/usr/bin/apt
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [users, adm, sudo]
    lock_passwd: false
    # Tạo hash: mkpasswd -m sha-512 'YourPassword'
    passwd: "CHANGE_ME_SHA512_HASH"
    ssh_authorized_keys:
      - "CHANGE_ME_SSH_PUBLIC_KEY"

# Mạng DHCP (đổi tên NIC nếu cần: ip link)
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
      dhcp6: false

# Giữ password SSH cho đến khi đã xác nhận key hoạt động
ssh_pwauth: true
disable_root: true

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - net-tools
  - ufw
  - fail2ban
  - unzip
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - python3-pip

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow http
  - ufw allow https
  - ufw --force enable
  - systemctl enable --now fail2ban || true
  # Sau khi SSH key hoạt động, có thể tắt password:
  # - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && systemctl reload ssh

final_message: "Ubuntu Server cloud-init completed. Đổi CHANGE_ME và kiểm tra SSH trước khi harden thêm."
