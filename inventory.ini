# Inventory VÍ DỤ — thay CHANGE_ME bằng IP/hostname thật trước khi chạy.
# App Servers (Monolithic app - UI + Logic cùng một server)
[appservers]
app-01 ansible_host=CHANGE_ME_APP_IP ansible_user=admin
# app-02 ansible_host=CHANGE_ME_APP2_IP ansible_user=admin  # Thêm nếu cần scale

# Database Servers (nếu database riêng; có thể trùng IP với app nếu all-in-one)
[dbservers]
db-master ansible_host=CHANGE_ME_DB_IP ansible_user=admin
# db-slave ansible_host=CHANGE_ME_DB_SLAVE_IP ansible_user=admin

# Legacy groups for compatibility
[webservers]
app-01

[allservers:children]
appservers
dbservers

[allservers:vars]
ansible_python_interpreter=/usr/bin/python3
