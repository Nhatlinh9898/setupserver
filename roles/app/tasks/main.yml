---
# Application Server Role - Docker, Node.js, Python, v.v.

- name: Cài đặt Docker dependencies (Debian)
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  when:
    - ansible_os_family == "Debian"
    - install_docker | default(true)

- name: Tạo keyrings directory (Debian)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when:
    - ansible_os_family == "Debian"
    - install_docker | default(true)

- name: Thêm Docker GPG key (Debian)
  get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when:
    - ansible_os_family == "Debian"
    - install_docker | default(true)

- name: Thêm Docker repository (Debian)
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when:
    - ansible_os_family == "Debian"
    - install_docker | default(true)

- name: Cài đặt Docker (Ubuntu/Debian)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes
  when:
    - ansible_os_family == "Debian"
    - install_docker | default(true)
  notify: restart docker

- name: Thêm Docker yum repo (RedHat)
  get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  when:
    - ansible_os_family == "RedHat"
    - install_docker | default(true)

- name: Cài đặt Docker (CentOS/RHEL)
  yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  when:
    - ansible_os_family == "RedHat"
    - install_docker | default(true)
  notify: restart docker

- name: Thêm user app vào docker group
  user:
    name: "{{ app_user | default('admin') }}"
    groups: docker
    append: yes
  when: install_docker | default(true)

- name: Enable Docker service
  service:
    name: docker
    enabled: yes
    state: started
  when: install_docker | default(true)

- name: Cài đặt Node.js (Ubuntu/Debian)
  apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and (install_nodejs | default(false))

- name: Cài đặt Node.js (CentOS/RHEL)
  yum:
    name:
      - nodejs
      - npm
    state: present
  when: ansible_os_family == "RedHat" and (install_nodejs | default(false))

- name: Cài đặt Python 3 và pip (Ubuntu/Debian)
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  when: ansible_os_family == "Debian"

- name: Cài đặt Python 3 và pip (CentOS/RHEL)
  yum:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_os_family == "RedHat"

- name: Cài đặt pip packages phổ biến
  pip:
    name:
      - setuptools
      - wheel
    executable: pip3
    state: present
  failed_when: false

- name: Cài đặt Git
  package:
    name: git
    state: present

- name: Tạo directory cho applications
  file:
    path: /opt/apps
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"

- name: Cài đặt PM2 (Process Manager cho Node.js)
  npm:
    name: pm2
    global: yes
  when: install_nodejs | default(false)

- name: Cài đặt Supervisor (Process Manager)
  package:
    name: supervisor
    state: present

- name: Enable Supervisor service
  service:
    name: supervisor
    enabled: yes
    state: started
  failed_when: false
