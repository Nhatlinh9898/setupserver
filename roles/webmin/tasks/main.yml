---
# Webmin Role - Cài đặt Webmin Web Interface

- name: Ensure keyrings directory exists (Webmin)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Webmin signing key (signed-by)
  get_url:
    url: https://download.webmin.com/jcameron-key.asc
    dest: /etc/apt/keyrings/webmin.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Dearmor Webmin key if needed
  shell: |
    if ! gpg --dearmor < /etc/apt/keyrings/webmin.asc > /etc/apt/keyrings/webmin.gpg 2>/dev/null; then
      cp /etc/apt/keyrings/webmin.asc /etc/apt/keyrings/webmin.gpg
    fi
  args:
    creates: /etc/apt/keyrings/webmin.gpg
  when: ansible_os_family == "Debian"

- name: Thêm Webmin repository (Ubuntu/Debian, signed-by)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/webmin.gpg] https://download.webmin.com/download/repository sarge contrib"
    state: present
    filename: webmin
  when: ansible_os_family == "Debian"

- name: Cài đặt Webmin (Ubuntu/Debian)
  apt:
    name: webmin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  notify: restart webmin

- name: Thêm Webmin repository (CentOS/RHEL)
  yum:
    name: https://download.webmin.com/download/newkey/webmin-newkey-1.0-1.noarch.rpm
    state: present
    disable_gpg_check: yes
  when: ansible_os_family == "RedHat"

- name: Thêm Webmin repository file (CentOS/RHEL)
  template:
    src: webmin.repo.j2
    dest: /etc/yum.repos.d/webmin.repo
    mode: '0644'
  when: ansible_os_family == "RedHat"

- name: Cài đặt Webmin (CentOS/RHEL)
  yum:
    name: webmin
    state: present
  when: ansible_os_family == "RedHat"
  notify: restart webmin

- name: Enable Webmin service
  systemd:
    name: webmin
    enabled: yes
    state: started

- name: Mở port Webmin trên firewall (Ubuntu) — only if explicitly enabled
  ufw:
    rule: allow
    port: "10000"
    proto: tcp
    from_ip: "{{ webmin_allow_cidr }}"
  when:
    - ansible_os_family == "Debian"
    - webmin_open_firewall | default(false)
    - (webmin_allow_cidr | default('127.0.0.1')) not in ['0.0.0.0/0', '*', 'any']

- name: Mở port Webmin trên firewall (CentOS) — only if explicitly enabled
  firewalld:
    port: 10000/tcp
    permanent: yes
    state: enabled
    source: "{{ webmin_allow_cidr }}"
  when:
    - ansible_os_family == "RedHat"
    - webmin_open_firewall | default(false)
    - (webmin_allow_cidr | default('127.0.0.1')) not in ['0.0.0.0/0', '*', 'any']
  notify: reload firewalld

- name: Cấu hình Webmin SSL/TLS
  lineinfile:
    path: /etc/webmin/miniserv.conf
    regexp: "^ssl="
    line: "ssl=1"
  notify: restart webmin

# TLS note: ssl=1 is set above. Prefer reverse-proxy + 2FA for remote admin.
# Default allow is localhost / admin CIDR — NEVER 0.0.0.0/0.
- name: Fail if Webmin allow CIDR is world-open
  fail:
    msg: "webmin_allow_cidr must not be 0.0.0.0/0. Set a real admin CIDR or leave 127.0.0.1."
  when: (webmin_allow_cidr | default('127.0.0.1')) in ['0.0.0.0/0', '*', 'any']

- name: Cấu hình Webmin allow (localhost or admin CIDR)
  lineinfile:
    path: /etc/webmin/miniserv.conf
    regexp: "^allow="
    line: "allow={{ webmin_allow_cidr | default('127.0.0.1') }}"
  notify: restart webmin

- name: Cấu hình Webmin theme
  lineinfile:
    path: /etc/webmin/config
    regexp: "^theme="
    line: "theme=gray-theme"
  notify: restart webmin

- name: Cấu hình Webmin language
  lineinfile:
    path: /etc/webmin/config
    regexp: "^lang="
    line: "lang=en"
  notify: restart webmin

- name: Cài đặt Webmin modules (tùy chọn)
  apt:
    name:
      - webmin-apache
      - webmin-bind8
      - webmin-cluster
      - webmin-dhcpd
      - webmin-firewall
      - webmin-fdisk
      - webmin-grub
      - webmin-htpasswd
      - webmin-inetd
      - webmin-logrotate
      - webmin-mount
      - webmin-nfs
      - webmin-pam
      - webmin-postfix
      - webmin-proftpd
      - webmin-qmailadmin
      - webmin-samba
      - webmin-sendmail
      - webmin-squid
      - webmin-sshd
      - webmin-useradmin
      - webmin-usermin
    state: present
  when: ansible_os_family == "Debian" and webmin_install_modules | default(false)
  notify: restart webmin
