---
# Deploy Role - Clone code từ Git (simple app path)

- name: Fail nếu thiếu cấu hình deploy Git
  fail:
    msg: "Cần project_path + git_repository hợp lệ (không chứa CHANGE_ME)."
  when: >
    project_path is not defined or (project_path | length) == 0
    or git_repository is not defined or (git_repository | length) == 0
    or (git_repository | regex_search('CHANGE_ME')) is not none

- name: Đảm bảo package git
  package:
    name: git
    state: present

- name: Tạo directory cho ứng dụng
  file:
    path: "{{ project_path }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"

- name: Đảm bảo ~/.ssh cho app_user
  file:
    path: "/home/{{ app_user | default('admin') }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: git_ssh_private_key is defined

- name: Setup SSH key cho Git private repository
  copy:
    content: "{{ git_ssh_private_key }}"
    dest: "/home/{{ app_user | default('admin') }}/.ssh/deploy_key"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: git_ssh_private_key is defined
  no_log: true

- name: Cấu hình SSH cho Git
  template:
    src: git-ssh-config.j2
    dest: "/home/{{ app_user | default('admin') }}/.ssh/config"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: git_ssh_private_key is defined

- name: Clone/update repository (SSH key)
  git:
    repo: "{{ git_repository }}"
    dest: "{{ project_path }}"
    version: "{{ git_branch | default('main') }}"
    force: "{{ git_force | default(false) }}"
    update: yes
    key_file: "/home/{{ app_user | default('admin') }}/.ssh/deploy_key"
    accept_hostkey: yes
  when: git_ssh_private_key is defined
  become_user: "{{ app_user | default('admin') }}"

- name: Clone/update repository (HTTPS + password)
  git:
    repo: "{{ git_repository }}"
    dest: "{{ project_path }}"
    version: "{{ git_branch | default('main') }}"
    force: "{{ git_force | default(false) }}"
    update: yes
  when:
    - git_ssh_private_key is not defined
    - git_password is defined
  become_user: "{{ app_user | default('admin') }}"
  no_log: true
  environment:
    GIT_ASKPASS: echo
    # Prefer embedding credentials via ansible git module password when available;
    # fallback: user should use SSH key or deploy token in URL carefully.

- name: Clone/update repository (public / credential in URL)
  git:
    repo: "{{ git_repository }}"
    dest: "{{ project_path }}"
    version: "{{ git_branch | default('main') }}"
    force: "{{ git_force | default(false) }}"
    update: yes
  when:
    - git_ssh_private_key is not defined
    - git_password is not defined
  become_user: "{{ app_user | default('admin') }}"

- name: Copy .env file từ template
  template:
    src: env.j2
    dest: "{{ project_path }}/.env"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: env_vars is defined

- name: Copy .env file từ content
  copy:
    content: "{{ env_content }}"
    dest: "{{ project_path }}/.env"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: env_content is defined
  no_log: true

- name: Setup ownership cho project
  file:
    path: "{{ project_path }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
    recurse: yes

- name: Tạo log directory
  file:
    path: "{{ project_path }}/logs"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"

- name: Tạo upload directory (nếu cần)
  file:
    path: "{{ project_path }}/uploads"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: create_upload_dir | default(false)

- name: Lấy commit hash hiện tại
  command: git rev-parse HEAD
  args:
    chdir: "{{ project_path }}"
  register: git_commit
  become_user: "{{ app_user | default('admin') }}"
  changed_when: false

- name: Hiển thị commit hash
  debug:
    msg: "Deployed commit: {{ git_commit.stdout }}"
