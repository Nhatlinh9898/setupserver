---
# Mesh Network Role - P2P VPN connection giữa các nodes

- name: Cài đặt WireGuard
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and mesh_network_type == "wireguard"

- name: Cài đặt WireGuard (CentOS)
  yum:
    name:
      - wireguard-tools
      - wireguard-dkms
    state: present
  when: ansible_os_family == "RedHat" and mesh_network_type == "wireguard"

- name: Cài đặt Tailscale
  block:
    - name: Ensure keyrings directory exists (Tailscale)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Tailscale signing key (signed-by)
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
        dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale repository (signed-by)
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
        state: present
        filename: tailscale

    - name: Install Tailscale
      apt:
        name: tailscale
        state: present
        update_cache: yes

  when: ansible_os_family == "Debian" and mesh_network_type == "tailscale"

- name: Cài đặt Tailscale (CentOS)
  block:
    - name: Add Tailscale repository
      yum:
        name: https://pkgs.tailscale.com/stable/centos/{{ ansible_distribution_major_version }}/tailscale.repo
        state: present

    - name: Install Tailscale
      yum:
        name: tailscale
        state: present

  when: ansible_os_family == "RedHat" and mesh_network_type == "tailscale"

- name: Tạo WireGuard private key
  shell: umask 077 && wg genkey > /etc/wireguard/privatekey
  args:
    creates: /etc/wireguard/privatekey
  when: mesh_network_type == "wireguard"
  no_log: true

- name: Harden WireGuard private key permissions
  file:
    path: /etc/wireguard/privatekey
    mode: '0600'
    owner: root
    group: root
  when: mesh_network_type == "wireguard"

- name: Tạo WireGuard public key
  shell: wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey
  args:
    creates: /etc/wireguard/publickey
  when: mesh_network_type == "wireguard"
  no_log: true

- name: Đọc WireGuard public key
  slurp:
    src: /etc/wireguard/publickey
  register: wg_public_key_b64
  when: mesh_network_type == "wireguard"

- name: Đọc WireGuard private key (no_log — used only for template)
  slurp:
    src: /etc/wireguard/privatekey
  register: wg_private_key_b64
  when: mesh_network_type == "wireguard"
  no_log: true

- name: Set WireGuard key facts
  set_fact:
    wg_public_key: "{{ wg_public_key_b64.content | b64decode | trim }}"
    wg_private_key: "{{ wg_private_key_b64.content | b64decode | trim }}"
  when: mesh_network_type == "wireguard"
  no_log: true

- name: Hiển thị WireGuard public key only
  debug:
    msg: "WireGuard Public Key: {{ wg_public_key }}"
  when: mesh_network_type == "wireguard"

- name: Cấu hình WireGuard interface
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  when: mesh_network_type == "wireguard"
  notify: restart wireguard

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: yes

- name: Bật WireGuard interface
  systemd:
    name: wg-quick@wg0
    enabled: yes
    state: started
  when: mesh_network_type == "wireguard"

- name: Ensure Tailscale auth key directory
  file:
    path: "{{ tailscale_authkey_file | default('/etc/tailscale/authkey') | dirname }}"
    state: directory
    mode: '0700'
    owner: root
    group: root
  when: mesh_network_type == "tailscale" and (tailscale_auth_key | default('') | length) > 0

- name: Write Tailscale auth key to env file (0600 — avoid cmdline leak)
  copy:
    content: "{{ tailscale_auth_key }}"
    dest: "{{ tailscale_authkey_file | default('/etc/tailscale/authkey') }}"
    mode: '0600'
    owner: root
    group: root
  when: mesh_network_type == "tailscale" and (tailscale_auth_key | default('') | length) > 0
  no_log: true

- name: Authenticate Tailscale (TS_AUTHKEY from 0600 file — not playbook cmdline)
  shell: |
    set -euo pipefail
    export TS_AUTHKEY="$(cat "{{ tailscale_authkey_file | default('/etc/tailscale/authkey') }}")"
    tailscale up --hostname "{{ mesh_node_name | default(inventory_hostname) }}"
  args:
    executable: /bin/bash
  when: mesh_network_type == "tailscale" and (tailscale_auth_key | default('') | length) > 0
  no_log: true
  ignore_errors: yes

- name: Bật Tailscale service
  systemd:
    name: tailscaled
    enabled: yes
    state: started
  when: mesh_network_type == "tailscale"

- name: Mở port WireGuard trên firewall (Ubuntu)
  ufw:
    rule: allow
    port: "{{ mesh_wireguard_port | default(51820) }}"
    proto: udp
  when: ansible_os_family == "Debian" and mesh_network_type == "wireguard"

- name: Mở port WireGuard trên firewall (CentOS)
  firewalld:
    port: "{{ mesh_wireguard_port | default(51820) }}/udp"
    permanent: yes
    state: enabled
  when: ansible_os_family == "RedHat" and mesh_network_type == "wireguard"
  notify: reload firewalld

- name: Tạo mesh network status script
  template:
    src: mesh_status.sh.j2
    dest: /usr/local/bin/mesh-status
    mode: '0755'
