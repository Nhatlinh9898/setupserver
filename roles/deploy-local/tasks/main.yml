---
# Deploy Local Role - Copy code từ local directory sang server

- name: Fail nếu thiếu local_code_path / project_path
  fail:
    msg: "Cần local_code_path (control node) và project_path (remote). Ví dụ local_code_path: ./app-code"
  when: >
    project_path is not defined or (project_path | length) == 0
    or local_code_path is not defined or (local_code_path | length) == 0

- name: Tạo directory cho ứng dụng
  file:
    path: "{{ project_path }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"

- name: Copy code từ local directory sang server
  synchronize:
    src: "{{ local_code_path }}/"
    dest: "{{ project_path }}/"
    delete: "{{ sync_delete | default(true) }}"
    recursive: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=venv"
      - "--exclude=__pycache__"
  # Ownership set separately — synchronize owner/group flags preserve source UIDs

- name: Setup ownership sau sync
  file:
    path: "{{ project_path }}"
    state: directory
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
    recurse: yes

- name: Copy .env file từ template
  template:
    src: env.j2
    dest: "{{ project_path }}/.env"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: env_vars is defined

- name: Copy .env file từ content
  copy:
    content: "{{ env_content }}"
    dest: "{{ project_path }}/.env"
    mode: '0600'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: env_content is defined
  no_log: true

- name: Tạo log directory
  file:
    path: "{{ project_path }}/logs"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"

- name: Tạo upload directory (nếu cần)
  file:
    path: "{{ project_path }}/uploads"
    state: directory
    mode: '0755'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: create_upload_dir | default(false)
