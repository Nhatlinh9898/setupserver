---
# Handlers cho role application (tách khỏi tasks)

- name: restart nginx
  service:
    name: nginx
    state: restarted

- name: restart supervisor
  service:
    name: supervisor
    state: restarted
  failed_when: false

- name: restart go-app
  systemd:
    name: "{{ app_name | default('go-app') }}"
    state: restarted
    daemon_reload: yes

- name: restart generic-app
  systemd:
    name: "{{ app_name | default('app') }}"
    state: restarted
    daemon_reload: yes
