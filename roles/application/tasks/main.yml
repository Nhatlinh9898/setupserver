---
# Application Role - Cấu hình và chạy ứng dụng (simple app path)

- name: Fail nếu thiếu project_path
  fail:
    msg: "project_path bắt buộc khi chạy role application (xem vars.yml)."
  when: project_path is not defined or (project_path | length) == 0

# Node.js Application
- name: Kiểm tra Node.js application (package.json)
  stat:
    path: "{{ project_path }}/package.json"
  register: node_app

- name: Cấu hình PM2 cho Node.js app
  template:
    src: ecosystem.config.js.j2
    dest: "{{ project_path }}/ecosystem.config.js"
    mode: '0644'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: node_app.stat.exists and (use_pm2 | default(true))

- name: Start hoặc reload Node.js app với PM2
  command: pm2 startOrReload ecosystem.config.js --update-env
  args:
    chdir: "{{ project_path }}"
  when: node_app.stat.exists and (use_pm2 | default(true))
  become_user: "{{ app_user | default('admin') }}"
  environment:
    NODE_ENV: "{{ node_env | default('production') }}"

- name: Save PM2 process list
  command: pm2 save
  when: node_app.stat.exists and (use_pm2 | default(true))
  become_user: "{{ app_user | default('admin') }}"

- name: Setup PM2 startup (best-effort)
  shell: |
    set -e
    env PATH="$PATH:/usr/bin" pm2 startup systemd -u {{ app_user | default('admin') }} --hp /home/{{ app_user | default('admin') }} || true
  when: node_app.stat.exists and (use_pm2 | default(true))
  become: yes
  failed_when: false

# Python / Django / Flask — ưu tiên framework cụ thể
- name: Kiểm tra Django (manage.py)
  stat:
    path: "{{ project_path }}/manage.py"
  register: django_app

- name: Kiểm tra Flask (app.py / wsgi.py)
  stat:
    path: "{{ project_path }}/{{ item }}"
  loop:
    - app.py
    - wsgi.py
  register: flask_candidates
  when: not django_app.stat.exists

- name: Set flask_app flag
  set_fact:
    flask_detected: "{{ (flask_candidates.results | default([]) | selectattr('stat.exists') | list | length) > 0 }}"
  when: not django_app.stat.exists

- name: Kiểm tra requirements.txt
  stat:
    path: "{{ project_path }}/requirements.txt"
  register: python_req

- name: Kiểm tra pyproject.toml
  stat:
    path: "{{ project_path }}/pyproject.toml"
  register: python_toml

- name: Run Django migrations
  community.general.django_manage:
    command: migrate
    project_path: "{{ project_path }}"
    virtualenv: "{{ project_path }}/venv"
  when: django_app.stat.exists
  become_user: "{{ app_user | default('admin') }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module | default('myproject.settings') }}"
  failed_when: false

- name: Collect Django static files
  community.general.django_manage:
    command: collectstatic
    project_path: "{{ project_path }}"
    virtualenv: "{{ project_path }}/venv"
  when: django_app.stat.exists
  become_user: "{{ app_user | default('admin') }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module | default('myproject.settings') }}"
  failed_when: false

- name: Tạo Supervisor config cho Django
  template:
    src: supervisor-django.conf.j2
    dest: "/etc/supervisor/conf.d/{{ app_name | default('django-app') }}.conf"
    mode: '0644'
  when: django_app.stat.exists
  notify: restart supervisor

- name: Tạo Supervisor config cho Flask
  template:
    src: supervisor-flask.conf.j2
    dest: "/etc/supervisor/conf.d/{{ app_name | default('flask-app') }}.conf"
    mode: '0644'
  when:
    - not django_app.stat.exists
    - flask_detected | default(false)
  notify: restart supervisor

- name: Tạo Supervisor config generic Python (không Django/Flask)
  template:
    src: supervisor-python.conf.j2
    dest: "/etc/supervisor/conf.d/{{ app_name | default('python-app') }}.conf"
    mode: '0644'
  when:
    - not django_app.stat.exists
    - not (flask_detected | default(false))
    - python_req.stat.exists or python_toml.stat.exists
  notify: restart supervisor

- name: Reread/update Supervisor program
  supervisorctl:
    name: "{{ app_name | default('python-app') }}"
    state: present
  when: django_app.stat.exists or (flask_detected | default(false)) or python_req.stat.exists or python_toml.stat.exists
  failed_when: false

# PHP Application
- name: Kiểm tra PHP application (composer.json)
  stat:
    path: "{{ project_path }}/composer.json"
  register: php_app

- name: Kiểm tra PHP application (index.php)
  stat:
    path: "{{ project_path }}/index.php"
  register: php_app_index

- name: Cấu hình Nginx cho PHP app (Debian sites-available)
  template:
    src: nginx-php.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name | default('php-app') }}"
    mode: '0644'
  when:
    - ansible_os_family == "Debian"
    - php_app.stat.exists or php_app_index.stat.exists
  notify: restart nginx

- name: Enable PHP app site (Debian)
  file:
    src: "/etc/nginx/sites-available/{{ app_name | default('php-app') }}"
    dest: "/etc/nginx/sites-enabled/{{ app_name | default('php-app') }}"
    state: link
  when:
    - ansible_os_family == "Debian"
    - php_app.stat.exists or php_app_index.stat.exists
  notify: restart nginx

- name: Cấu hình Nginx cho PHP app (RedHat conf.d)
  template:
    src: nginx-php.conf.j2
    dest: "/etc/nginx/conf.d/{{ app_name | default('php-app') }}.conf"
    mode: '0644'
  when:
    - ansible_os_family == "RedHat"
    - php_app.stat.exists or php_app_index.stat.exists
  notify: restart nginx

- name: Remove default Nginx site (Debian)
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when:
    - ansible_os_family == "Debian"
    - php_app.stat.exists or php_app_index.stat.exists
  notify: restart nginx

# Ruby/Rails
- name: Kiểm tra Rails application (config.ru)
  stat:
    path: "{{ project_path }}/config.ru"
  register: rails_app

- name: Run Rails migrations
  command: bundle exec rails db:migrate
  args:
    chdir: "{{ project_path }}"
  when: rails_app.stat.exists
  become_user: "{{ app_user | default('admin') }}"
  environment:
    RAILS_ENV: "{{ rails_env | default('production') }}"
  failed_when: false

- name: Precompile Rails assets
  command: bundle exec rails assets:precompile
  args:
    chdir: "{{ project_path }}"
  when: rails_app.stat.exists
  become_user: "{{ app_user | default('admin') }}"
  environment:
    RAILS_ENV: "{{ rails_env | default('production') }}"
  failed_when: false

- name: Tạo Puma config cho Rails
  template:
    src: puma.rb.j2
    dest: "{{ project_path }}/config/puma.rb"
    mode: '0644'
    owner: "{{ app_user | default('admin') }}"
    group: "{{ app_user | default('admin') }}"
  when: rails_app.stat.exists

- name: Tạo Supervisor config for Puma
  template:
    src: supervisor-puma.conf.j2
    dest: "/etc/supervisor/conf.d/{{ app_name | default('rails-app') }}.conf"
    mode: '0644'
  when: rails_app.stat.exists
  notify: restart supervisor

# Go Application
- name: Kiểm tra Go application (main.go)
  stat:
    path: "{{ project_path }}/main.go"
  register: go_app

- name: Build Go application
  command: "go build -o {{ app_name | default('app') }}"
  args:
    chdir: "{{ project_path }}"
  when: go_app.stat.exists
  become_user: "{{ app_user | default('admin') }}"
  environment:
    GOPATH: "/home/{{ app_user | default('admin') }}/go"
    CGO_ENABLED: "0"

- name: Tạo systemd service cho Go app
  template:
    src: systemd-go.service.j2
    dest: "/etc/systemd/system/{{ app_name | default('go-app') }}.service"
    mode: '0644'
  when: go_app.stat.exists
  notify: restart go-app

- name: Enable và start Go app service
  systemd:
    name: "{{ app_name | default('go-app') }}"
    enabled: yes
    state: started
    daemon_reload: yes
  when: go_app.stat.exists

# Generic Systemd Service
- name: Tạo generic systemd service
  template:
    src: systemd-generic.service.j2
    dest: "/etc/systemd/system/{{ app_name | default('app') }}.service"
    mode: '0644'
  when: create_systemd_service | default(false)
  notify: restart generic-app

- name: Enable và start generic service
  systemd:
    name: "{{ app_name | default('app') }}"
    enabled: yes
    state: started
    daemon_reload: yes
  when: create_systemd_service | default(false)

# Health check (tùy chọn, không fail play)
- name: Chờ ứng dụng listen port
  wait_for:
    port: "{{ app_port }}"
    host: 127.0.0.1
    delay: 3
    timeout: 60
  when: app_port is defined and (health_check_enabled | default(false))
  failed_when: false

- name: Kiểm tra application health endpoint
  uri:
    url: "http://127.0.0.1:{{ app_port }}{{ health_check_path | default('/health') }}"
    status_code: "{{ health_check_status | default(200) }}"
  when: app_port is defined and (health_check_enabled | default(false))
  failed_when: false
  register: health_check

- name: Hiển thị health check result
  debug:
    msg: "Health check: {{ 'PASSED' if (health_check.status | default(0)) == (health_check_status | default(200)) else 'FAILED or skipped' }}"
  when: app_port is defined and (health_check_enabled | default(false))
