---
# Handlers for federated-learning (moved out of tasks — tasks files cannot contain handlers:)

- name: restart fl-server
  systemd:
    name: fl-server
    state: restarted
    daemon_reload: yes

- name: restart fl-client
  systemd:
    name: fl-client
    state: restarted
    daemon_reload: yes

- name: reload firewalld
  systemd:
    name: firewalld
    state: reloaded
