---
# Database Role - Cài đặt MySQL hoặc PostgreSQL

- name: Cảnh báo nếu mật khẩu MySQL còn CHANGE_ME
  debug:
    msg: "CẢNH BÁO: mysql_password vẫn là placeholder CHANGE_ME — hãy đổi trong vars.yml trước production."
  when:
    - install_mysql | default(true)
    - (mysql_password | default('')) is search('CHANGE_ME')

- name: Cài đặt MySQL Server (Ubuntu/Debian)
  apt:
    name:
      - mysql-server
      - mysql-client
      - python3-pymysql
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and (install_mysql | default(true))
  notify: restart mysql

- name: Cài đặt MySQL/MariaDB Server (CentOS/RHEL)
  yum:
    name:
      - mariadb-server
      - mariadb
      - python3-PyMySQL
    state: present
  when: ansible_os_family == "RedHat" and (install_mysql | default(true))
  notify: restart mysql

- name: Cài đặt PostgreSQL (Ubuntu/Debian)
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and (install_postgresql | default(false))
  notify: restart postgresql

- name: Cài đặt PostgreSQL (CentOS/RHEL)
  yum:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
    state: present
  when: ansible_os_family == "RedHat" and (install_postgresql | default(false))
  notify: restart postgresql

- name: Khởi tạo PostgreSQL database (CentOS)
  command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/postgresql.conf
  when: ansible_os_family == "RedHat" and (install_postgresql | default(false))
  notify: restart postgresql
  failed_when: false

- name: Enable MySQL/MariaDB service (Debian)
  service:
    name: mysql
    enabled: yes
    state: started
  when: ansible_os_family == "Debian" and (install_mysql | default(true))

- name: Enable MariaDB service (RedHat)
  service:
    name: mariadb
    enabled: yes
    state: started
  when: ansible_os_family == "RedHat" and (install_mysql | default(true))

- name: Enable PostgreSQL service
  service:
    name: postgresql
    enabled: yes
    state: started
  when: install_postgresql | default(false)

- name: Tạo MySQL database
  mysql_db:
    name: "{{ mysql_database | default('appdb') }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: ansible_os_family == "Debian" and (install_mysql | default(true))
  become: yes

- name: Tạo MariaDB database (RedHat)
  mysql_db:
    name: "{{ mysql_database | default('appdb') }}"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock
  when: ansible_os_family == "RedHat" and (install_mysql | default(true))
  become: yes
  failed_when: false

- name: Tạo MySQL user (Debian)
  mysql_user:
    name: "{{ mysql_user | default('appuser') }}"
    password: "{{ mysql_password }}"
    priv: "{{ mysql_database | default('appdb') }}.*:ALL"
    host: "{{ '%' if (mysql_allow_remote | default(false)) else 'localhost' }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when:
    - ansible_os_family == "Debian"
    - install_mysql | default(true)
    - mysql_password is defined
    - (mysql_password | regex_search('CHANGE_ME')) is none
  become: yes


- name: Tạo MySQL/MariaDB user (RedHat)
  mysql_user:
    name: "{{ mysql_user | default('appuser') }}"
    password: "{{ mysql_password }}"
    priv: "{{ mysql_database | default('appdb') }}.*:ALL"
    host: "{{ '%' if (mysql_allow_remote | default(false)) else 'localhost' }}"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock
  when:
    - ansible_os_family == "RedHat"
    - install_mysql | default(true)
    - mysql_password is defined
    - (mysql_password | regex_search('CHANGE_ME')) is none
  become: yes
  failed_when: false

- name: Cấu hình MySQL bind-address (Debian, chỉ khi cho phép remote)
  template:
    src: mysql.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    backup: yes
  when:
    - ansible_os_family == "Debian"
    - install_mysql | default(true)
    - mysql_allow_remote | default(false)
  notify: restart mysql

- name: Mở port MySQL trên firewall (Ubuntu) — chỉ khi remote
  ufw:
    rule: allow
    port: "3306"
    proto: tcp
  when:
    - ansible_os_family == "Debian"
    - install_mysql | default(true)
    - mysql_allow_remote | default(false)

- name: Mở port MySQL trên firewall (CentOS) — chỉ khi remote
  firewalld:
    service: mysql
    permanent: yes
    state: enabled
    immediate: yes
  when:
    - ansible_os_family == "RedHat"
    - install_mysql | default(true)
    - mysql_allow_remote | default(false)

- name: Mở port PostgreSQL trên firewall (Ubuntu) — chỉ khi remote
  ufw:
    rule: allow
    port: "5432"
    proto: tcp
  when:
    - ansible_os_family == "Debian"
    - install_postgresql | default(false)
    - postgresql_allow_remote | default(false)

- name: Mở port PostgreSQL trên firewall (CentOS) — chỉ khi remote
  firewalld:
    service: postgresql
    permanent: yes
    state: enabled
    immediate: yes
  when:
    - ansible_os_family == "RedHat"
    - install_postgresql | default(false)
    - postgresql_allow_remote | default(false)
