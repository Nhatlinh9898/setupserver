---
# Ansible Variables — VÍ DỤ / TEMPLATE
# Đổi mọi giá trị CHANGE_ME trước khi chạy production.
# Không commit mật khẩu thật vào git.

# =============================================================================
# CORE — đường dẫn mặc định (web + app + database)
# =============================================================================

# Web Server
install_nginx: true
install_apache: false  # true nếu muốn Apache thay Nginx

# Database
install_mysql: true
install_postgresql: false
mysql_database: appdb
mysql_user: appuser
mysql_password: "CHANGE_ME_STRONG_PASSWORD"  # BẮT BUỘC đổi
mysql_allow_remote: false  # true chỉ khi app và DB tách server có kiểm soát
postgresql_allow_remote: false
postgresql_database: appdb
postgresql_user: appuser
postgresql_password: "CHANGE_ME_STRONG_PASSWORD"  # BẮT BUỘC đổi

# Application runtime (role app)
install_docker: true
install_nodejs: false
app_user: admin

# Domain / TLS (Nginx)
domain_name: example.com
ssl_enabled: false

# Firewall
allow_ssh_ip: "0.0.0.0/0"  # Nên giới hạn IP nếu có thể

# =============================================================================
# Deploy app (TẮT mặc định — bật khi đã có repo/path thật)
# =============================================================================
deploy_enabled: false
deploy_method: git  # git | local
project_path: /opt/apps/my-app
local_code_path: "./app-code"  # dùng khi deploy_method: local
app_name: my-app
app_port: 3000
health_check_enabled: false
git_repository: "https://github.com/CHANGE_ME/CHANGE_ME.git"
git_branch: main
git_force: false  # true chỉ khi chấp nhận ghi đè working tree
# git_ssh_private_key: |   # chỉ khi repo private
#   -----BEGIN OPENSSH PRIVATE KEY-----
#   CHANGE_ME
#   -----END OPENSSH PRIVATE KEY-----

# =============================================================================
# Feature flags — mặc định TẮT (ngoài CORE)
# =============================================================================
data_storage_enabled: false
prisma_integration_enabled: false
install_remote_management: false  # cockpit, webmin, monitoring, portainer
install_cuda: false
install_ai_ml: false
install_ai_security: false
install_app_hardening: false
install_container_isolation: false
install_ai_security_response: false
install_ai_ops: false  # chatops, monitoring AI, healing, assistant
install_ai_chatops: false
install_ai_monitoring: false
install_ai_healing: false
install_ai_assistant: false
install_ollama: false
ollama_api_enabled: false
ollama_api_bind: "127.0.0.1"
ai_healing_auto_enabled: false
ai_security_response_auto_enabled: false
ai_security_response_enabled: false
app_hardening_enabled: false
container_monitor_enabled: false
install_ray_cluster: false
install_gpu_api_service: false
install_federated_learning: false
install_mesh_network: false
install_auto_client_setup: false
