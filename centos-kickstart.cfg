# Kickstart cho Rocky Linux / AlmaLinux 9 (CentOS Stream tương thích)
# CentOS 8 mirror đã EOL — KHÔNG dùng mirror.centos.org/centos/8
# Boot: inst.ks=hd:LABEL=OEMDRV:/ks.cfg hoặc inst.ks=http://.../ks.cfg
# THAY mọi CHANGE_ME. Đừng tắt PasswordAuthentication khi key vẫn là placeholder.

# Cài đặt cơ bản
text
cdrom
lang en_US.UTF-8
keyboard us
timezone Asia/Ho_Chi_Minh --utc

network --bootproto=dhcp --device=link --onboot=yes --ipv6=auto --hostname=server-01

# Hash: openssl passwd -6 'YourPassword'
rootpw --iscrypted CHANGE_ME_SHA512_HASH
user --name=admin --groups=wheel --password=CHANGE_ME_SHA512_HASH --iscrypted

autopart --type=lvm --fstype=xfs
clearpart --all --initlabel
bootloader --location=mbr

firewall --enabled --service=ssh,http,https
selinux --enforcing

# authselect thay authconfig trên EL8+
authselect select sssd with-silent-lastlog --force

services --enabled=sshd,NetworkManager,chronyd,firewalld

# Repo ví dụ Rocky 9 — đổi nếu dùng Alma/CentOS Stream
url --url="https://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/"
repo --name="extras" --baseurl="https://dl.rockylinux.org/pub/rocky/9/extras/x86_64/os/"

%packages
@core
@standard
vim-enhanced
curl
wget
git
htop
net-tools
firewalld
fail2ban
unzip
python3
python3-pip
%end

%post --log=/root/ks-post.log
#!/bin/bash
set -e

dnf -y update || true

# SSH: tắt root login; GIỮ password auth cho đến khi key thật đã vào
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

mkdir -p /home/admin/.ssh
chmod 700 /home/admin/.ssh
# Thay dòng dưới bằng public key thật (một dòng)
echo "CHANGE_ME_SSH_PUBLIC_KEY" > /home/admin/.ssh/authorized_keys
chown -R admin:admin /home/admin/.ssh
chmod 600 /home/admin/.ssh/authorized_keys

firewall-cmd --permanent --add-service=ssh
firewall-cmd --permanent --add-service=http
firewall-cmd --permanent --add-service=https
firewall-cmd --reload || true

systemctl enable --now fail2ban || true

if [ ! -f /swapfile ]; then
  fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
  chmod 600 /swapfile
  mkswap /swapfile
  swapon /swapfile
  echo '/swapfile none swap sw 0 0' >> /etc/fstab
fi

cat >> /etc/sysctl.d/99-server-setup.conf << 'SYSCTL'
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 600
vm.swappiness = 10
SYSCTL
sysctl --system || true

echo "Kickstart post-install completed. Replace CHANGE_ME values before production."
%end

reboot
